<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>奥特自走棋 · 第二赛季</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="information.css"><link rel="stylesheet" href="season2/season.css"><link rel="stylesheet" href="play-ui.css"></head><body>
<header class="topbar"><a class="brand" href="season2/"><span class="brand-mark">✦</span><span>奥特自走棋<small>第二赛季 · 海洋</small></span></a><div class="header-right"><a class="text-btn" href="?mode=match">第一赛季</a><button id="catalog-open">图鉴</button><button id="settings-open">设置</button></div></header>
<main><div id="hud" class="hud"></div><div id="owned-augments" class="owned-augments" hidden></div><div class="ocean-layout"><aside class="panel shop-panel"><div class="panel-head"><h2>商店</h2><button id="lock">锁定</button></div><div class="shop-controls"><button id="refresh">刷新 · 2金币</button><button id="xp">经验 · 4金币</button></div><div id="shop"></div><div id="systems"></div></aside>
<section><div class="arena-top"><span id="view-label">我方棋盘</span><span id="phase"></span><button id="encounter"></button><button id="own">返回我方</button></div><div class="arena-shell"><canvas id="arena" width="900" height="750" tabindex="0" aria-label="棋盘，选择棋子后点击己方格子部署"></canvas></div><div class="battle-controls"><button id="start" class="primary">准备完毕 · 开战</button><button id="pause">暂停</button><label>速度<select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="restart">新开一局</button></div><section class="panel bench-panel"><div class="panel-head"><h2>备战席 <small id="bench-count"></small></h2></div><div id="bench"></div><h3>装备</h3><div id="inventory"></div><div id="inventory-info"></div></section></section>
<aside class="panel"><h2>玩家</h2><div id="players"></div><section id="detail"></section><h3>羁绊</h3><div id="traits"></div><h3>战斗记录</h3><div id="log" class="log"></div></aside></div></main>
<dialog id="choice"><div class="dialog-inner"><div class="panel-head"><h2 id="choice-title"></h2></div><div id="choice-list" class="choices"></div></div></dialog>
<dialog id="reference"><div class="dialog-inner catalog-inner"><div class="panel-head"><h2>图鉴</h2><button data-close="reference">关闭</button></div><div class="tabs"><button data-tab="棋子">棋子</button><button data-tab="装备">装备</button><button data-tab="羁绊">羁绊</button><button data-tab="强化">强化</button></div><input id="search" type="search" placeholder="搜索"><div id="reference-list"></div></div></dialog>
<dialog id="info"><div class="dialog-inner"><div class="panel-head"><h2 id="info-title"></h2><button data-close="info">关闭</button></div><div id="info-body"></div></div></dialog>
<dialog id="result"><div class="dialog-inner"><h2 id="result-title"></h2><div id="result-body"></div><button id="next" class="primary">继续</button><button id="return-board">返回棋盘</button></div></dialog>
<dialog id="settings"><div class="dialog-inner"><div class="panel-head"><h2>声音与显示</h2><button data-close="settings">关闭</button></div><h3>音乐</h3><div class="music-transport"><button id="music-prev" aria-label="上一首">⏮</button><button id="music-toggle">播放</button><button id="music-next" aria-label="下一首">⏭</button><span id="music-state">已停止</span></div><label class="setting-row">音乐音量<input id="music-volume" type="range" min="0" max="100" value="35"></label><label class="setting-row">战斗音效<input id="sound" type="checkbox" checked></label><label class="setting-row">音效音量<input id="volume" type="range" min="0" max="100" value="45"></label><label class="setting-row">减少动效<input id="reduced" type="checkbox"></label></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><script type="module" src="season2/app.mjs"></script></body></html>
