<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9e2d4"><title>奥特自走棋 · 星庭演武</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./match.css"><link rel="stylesheet" href="./information.css"><link rel="stylesheet" href="./play-ui.css"></head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark">✦</span><span>奥特自走棋<small>星庭演武 · 完整对局原型 0.9</small></span></a><div class="header-right"><a class="text-btn mode-link" href="?mode=match">八人对局</a><a class="text-btn mode-link" href="./">战斗实验场</a><a class="text-btn mode-link" href="./season2/">第二赛季</a><span class="prototype">研发原型</span><button id="catalog-open" class="text-btn">设计图鉴 · 59</button><button id="settings-open" class="text-btn">设置</button></div></header>
<main>
 <section class="commandbar"><div><h1 hidden>奥特自走棋</h1><p id="status">准备阶段</p></div><div class="seed-control"><label for="seed">对局种子</label><input id="seed" type="number" min="0" max="4294967295" value="4317"><button id="random-seed" title="换一个种子" aria-label="随机种子">↻</button></div></section>
 <div class="workspace">
  <aside class="roster-panel panel"><div class="panel-head"><h2>参战棋子</h2><span id="unit-count"></span></div><div class="tabs" role="tablist"><button id="player-tab" class="selected" role="tab" aria-selected="true">我方</button><button id="enemy-tab" role="tab" aria-selected="false">对手</button></div><div class="roster-controls"><label>星级<select id="star"><option value="1">一星</option><option value="2" selected>二星</option><option value="3">三星</option></select></label><label class="check"><input id="hero" type="checkbox" checked> 英雄强化</label></div><div id="roster" class="roster"></div><p class="panel-foot" hidden></p></aside>
  <section class="arena-wrap"><div class="arena-top"><span class="team-label enemy">对手阵容 <b id="enemy-size">0</b></span><span id="battle-clock">准备阶段</span><span class="team-label player">我方阵容 <b id="player-size">0</b></span></div><div class="arena-shell"><canvas id="arena" role="img" aria-label="七列八排六边形棋盘，可点击布置棋子"></canvas><div id="selection-tip" class="selection-tip" hidden></div><div class="arena-seal" aria-hidden="true">✦</div></div><div class="battle-controls"><button id="start" class="primary">开始战斗 <span>→</span></button><button id="pause" disabled>暂停</button><button id="reset">回到准备</button><button id="preset">载入演武阵容</button><label>速度<select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><div class="scope-note" hidden></div></section>
  <aside class="detail-panel panel"><div class="panel-head"><h2>阵容与战报</h2><button id="clear-side" class="text-btn">清空本方</button></div><div id="unit-detail" class="unit-detail"><h3>棋子详情</h3></div><div class="trait-heading"><h3>我方羁绊</h3></div><div id="traits" class="traits"></div><div class="log-heading"><h3>战斗记录</h3><button id="export" class="text-btn">导出</button></div><div id="log" class="log" aria-live="off"><p class="empty">战斗尚未开始</p></div></aside>
 </div>
</main>
<dialog id="result"><div class="dialog-inner"><span class="eyebrow">COMBAT COMPLETE</span><div id="result-symbol" class="result-symbol">✦</div><h2 id="result-title"></h2><p id="result-description"></p><div id="damage-list"></div><div class="dialog-actions"><button id="replay" class="primary">同种子重放</button><button id="return" autofocus>回到准备</button></div></div></dialog>
<dialog id="catalog"><div class="dialog-inner catalog-inner"><div class="panel-head"><h2>图鉴</h2><button data-close="catalog">关闭</button></div><input id="catalog-search" type="search" placeholder="搜索棋子、装备或羁绊" aria-label="搜索棋子、装备或羁绊"><div id="catalog-list"></div></div></dialog>
<dialog id="settings"><div class="dialog-inner"><div class="panel-head"><h2>声音与显示</h2><button data-close="settings">关闭</button></div><section class="music-controls"><h3>大厅音乐</h3><div class="music-transport"><button id="music-prev" aria-label="上一首">⏮</button><button id="music-toggle">播放</button><button id="music-next" aria-label="下一首">⏭</button><span id="music-state" role="status">已停止</span></div><label class="setting-row"><span>音乐音量</span><input id="music-volume" type="range" min="0" max="100" value="35"></label></section><label class="setting-row"><span>战斗音效</span><input id="sound" type="checkbox"></label><label class="setting-row"><span>音效音量</span><input id="volume" type="range" min="0" max="100" value="25"></label><label class="setting-row"><span>减少动效</span><input id="reduced" type="checkbox"></label></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="./app.mjs"></script>
</body></html>
